name: sivpro_app

description: "A new Flutter project."

publish_to: 'none'

version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  flutter_native_splash: ^2.4.8
  flutter_svg: ^2.3.0
  google_fonts: ^8.2.1
  sensors_plus: ^7.1.0
  file_picker: ^8.1.6
  flutter_map: ^7.0.0
  latlong2: ^0.9.0
  url_launcher: ^6.2.0
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/img/

flutter_native_splash:
  color: "#FFFFFF"

  android_12:
    color: "#FFFFFF"

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/img/icono_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/img/icono_logo.png"